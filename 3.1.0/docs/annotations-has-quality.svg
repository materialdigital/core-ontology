<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 328" width="720" height="328" role="img" aria-labelledby="t">
  <title id="t">Annotations of has quality</title>
  <style>text{font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif;font-size:14px;fill:#1f2937}.k{font-weight:700}.m{fill:#6b7280;font-size:12.5px}.h{fill:#fff;font-size:16px;font-weight:600}</style>
  <rect x="0.5" y="0.5" width="719" height="327" rx="8" fill="#fff" stroke="#c7ccd4"/>
  <path d="M0.5 36V8.5a8 8 0 0 1 8-8H711.5a8 8 0 0 1 8 8V36z" fill="#2f79c3"/>
  <text class="h" x="16" y="24.0">Annotations: has quality</text>
  <text class="k" x="24" y="60">label</text>
  <text class="m" x="73" y="60">[language: en]</text>
  <text x="24" y="82">has quality</text>
  <path d="M16 98H704" stroke="#e5e7eb"/>
  <text class="k" x="24" y="118">definition</text>
  <text class="m" x="112" y="118">[language: en]</text>
  <text x="24" y="140">a relation between an independent continuant (the bearer) and a quality, in which the quality</text>
  <text x="24" y="160">specifically depends on the bearer for its existence</text>
  <path d="M16 176H704" stroke="#e5e7eb"/>
  <text class="k" x="24" y="196">editor note</text>
  <text class="m" x="120" y="196">[language: en]</text>
  <text x="24" y="218">A bearer can have many qualities, and its qualities can exist for different periods of time, but</text>
  <text x="24" y="238">none of its qualities can exist when the bearer does not exist.</text>
  <path d="M16 254H704" stroke="#e5e7eb"/>
  <text class="k" x="24" y="274">example of usage</text>
  <text class="m" x="159" y="274">[language: en]</text>
  <text x="24" y="296">this apple has quality this red color</text>
</svg>
