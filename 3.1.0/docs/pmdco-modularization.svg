  <path class="edge" d="M1165,249 C1100,249 1120,129 1064,129"/>
  <path class="edge" d="M1165,249 C1100,249 1120,211 1064,211"/>
  <path class="edge" d="M1165,249 C1100,249 1120,293 1064,293"/>
