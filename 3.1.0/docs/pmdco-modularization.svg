      .lbl { font-weight: 700; font-size: 28.5px; dominant-baseline: central; }
      .cap { font-size: 26.5px; }
      .edge { fill: none; stroke: #333; stroke-width: 2.5; marker-end: url(#arrow); }
      .dash { stroke-dasharray: 12 9; }
      .line { fill: none; stroke: #333; stroke-width: 2.5; }
    </style>
  </defs>

