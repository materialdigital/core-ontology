<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 758" width="720" height="758" role="img" aria-labelledby="t">
  <title id="t">Annotations of material</title>
  <style>text{font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif;font-size:14px;fill:#1f2937}.k{font-weight:700}.m{fill:#6b7280;font-size:12.5px}.h{fill:#fff;font-size:16px;font-weight:600}</style>
  <rect x="0.5" y="0.5" width="719" height="757" rx="8" fill="#fff" stroke="#c7ccd4"/>
  <path d="M0.5 36V8.5a8 8 0 0 1 8-8H711.5a8 8 0 0 1 8 8V36z" fill="#d4ac0d"/>
  <text class="h" x="16" y="24.0">Annotations: material</text>
  <text class="k" x="24" y="60">label</text>
  <text class="m" x="73" y="60">[language: en]</text>
  <text x="24" y="82">material</text>
  <path d="M16 98H704" stroke="#e5e7eb"/>
  <text class="k" x="24" y="118">label</text>
  <text class="m" x="73" y="118">[language: de]</text>
  <text x="24" y="140">Material</text>
  <path d="M16 156H704" stroke="#e5e7eb"/>
  <text class="k" x="24" y="176">skos:definition</text>
  <text class="m" x="152" y="176">[language: en]</text>
  <text x="24" y="198">A material is a portion of matter that may participate in some manufacturing process and whose</text>
  <text x="24" y="218">shape is not relevant for its participation in the manufacturing process.</text>
  <path d="M16 234H704" stroke="#e5e7eb"/>
  <text class="k" x="24" y="254">skos:altLabel</text>
  <text class="m" x="136" y="254">[language: en]</text>
  <text x="24" y="276">Portion of Material</text>
  <path d="M16 292H704" stroke="#e5e7eb"/>
  <text class="k" x="24" y="312">isInMinimalProfile</text>
  <text class="m" x="175" y="312">[type: boolean]</text>
  <text x="24" y="334">true</text>
  <path d="M16 350H704" stroke="#e5e7eb"/>
  <text class="k" x="24" y="370">rdfs:comment</text>
  <text class="m" x="128" y="370">[language: en]</text>
  <text x="24" y="392">Instances of Portions Of Matter whose shape is relevant for their dispostion to participate in a</text>
  <text x="24" y="412">manufacturing process may be (subclasses of) objects that bear a &#x27;blank role&#x27; in the context of</text>
  <text x="24" y="432">the manufacturing process.</text>
  <path d="M16 448H704" stroke="#e5e7eb"/>
  <text class="k" x="24" y="468">rdfs:comment</text>
  <text class="m" x="128" y="468">[language: en]</text>
  <text x="24" y="490">Material is defined in terms of the three main perspectives that material specifications rely on:</text>
  <text x="24" y="510">the structure of the material (&quot;intensive quality&quot;), the performance of the material (&quot;behavoiral</text>
  <text x="24" y="530">material property&quot;) and the processing the material must have undergone (&quot;output of some</text>
  <text x="24" y="550">process&quot;).</text>
  <text x="24" y="570"></text>
  <text x="24" y="590">When defining specific materials/material taxonomies, these three aspects shall be taken into</text>
  <text x="24" y="610">account in the aristotelian (&quot;per genus et differentiam&quot;) as differentiation.</text>
  <path d="M16 626H704" stroke="#e5e7eb"/>
  <text class="k" x="24" y="646">rdfs:comment</text>
  <text class="m" x="128" y="646">[language: en]</text>
  <text x="24" y="668">The sum of portions of matter of the same type form a portion of matter of that type.</text>
  <path d="M16 684H704" stroke="#e5e7eb"/>
  <text class="k" x="24" y="704">term editor</text>
  <text x="24" y="726">PERSON: Joerg Waitelonis</text>
</svg>
